<!DOCTYPE html>
<html lang="th" class="[scroll-padding-top:env(safe-area-inset-top,0px)]">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สมุดแมทช์ — บันทึกผล PTCG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          display: ['Fraunces', 'Georgia', 'serif'],
          sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
        },
      },
    },
  };
</script>
<style>
  :root {
    --bg: #eef0ea; --surface: #ffffff; --surface-2: #f7f7f2; --border: #dcded4;
    --text: #1d211d; --text-muted: #6c7168;
    --accent: #b8721c; --accent-soft: #f1e2c9;
    --win: #2f7d4f; --win-soft: #dcefe1;
    --loss: #ae3a2d; --loss-soft: #f6dcd8;
    --tie-soft: #e7e7df;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151c; --surface: #1a1f29; --surface-2: #1f2530; --border: #2b3242;
      --text: #edf0f5; --text-muted: #8b93a5;
      --accent: #e8a33d; --accent-soft: #3a3020;
      --win: #5fa876; --win-soft: #1e3327;
      --loss: #d1665c; --loss-soft: #3a2220;
      --tie-soft: #262b35;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151c; --surface: #1a1f29; --surface-2: #1f2530; --border: #2b3242;
    --text: #edf0f5; --text-muted: #8b93a5;
    --accent: #e8a33d; --accent-soft: #3a3020;
    --win: #5fa876; --win-soft: #1e3327;
    --loss: #d1665c; --loss-soft: #3a2220;
    --tie-soft: #262b35;
  }
</style>
</head>
<body class="min-h-screen bg-[var(--bg)] text-[var(--text)] font-sans [-webkit-font-smoothing:antialiased] [padding-top:env(safe-area-inset-top,0px)] [padding-bottom:env(safe-area-inset-bottom,0px)]">
<div class="max-w-[880px] mx-auto px-5 pt-8 pb-16">

  <div class="flex gap-2 mb-[22px]">
    <button type="button" id="tabLive" data-mode="live"
      class="flex-1 border rounded-xl text-center shadow-sm py-3 px-3.5 font-display text-[15px] font-semibold cursor-pointer border-[var(--accent)] bg-[var(--accent-soft)] text-[var(--text)]">
      📱 TCG Live<span class="block font-sans text-[11px] font-normal text-[var(--text-muted)] mt-0.5">บันทึกประจำวัน</span>
    </button>
    <button type="button" id="tabOffline" data-mode="offline"
      class="flex-1 border rounded-xl text-center shadow-sm py-3 px-3.5 font-display text-[15px] font-semibold cursor-pointer border-[var(--border)] bg-[var(--surface)] text-[var(--text-muted)]">
      🎪 เล่นข้างนอก<span class="block font-sans text-[11px] font-normal text-[var(--text-muted)] mt-0.5">ตั้งชื่อรายการ · เลือกวันที่ · ระบุประเภท</span>
    </button>
  </div>

  <header class="flex flex-wrap items-end justify-between gap-5 mb-7">
    <div>
      <p id="wordmarkText" class="font-display text-[27px] sm:text-[32px] font-semibold tracking-tight mb-1">สมุดแมทช์</p>
      <p id="taglineText" class="text-[var(--text-muted)] text-sm">บันทึกผลการเล่น Pokémon TCG แต่ละเกม แล้วดูอัตราชนะของเด็คคุณ</p>
    </div>
    <div class="flex flex-wrap gap-2.5" id="statChips"></div>
  </header>

  <section class="bg-[var(--surface)] border border-[var(--border)] rounded-2xl shadow-sm p-[22px] mb-6">
    <h2 id="formTitle" class="font-display text-[19px] font-semibold mb-4">บันทึกแมทช์ใหม่</h2>
    <form id="matchForm">
      <div class="grid grid-cols-1 gap-3.5 mb-3.5" id="dateFieldWrap">
        <div>
          <label for="f_date" class="block text-[12.5px] text-[var(--text-muted)] mb-1.5">วันที่</label>
          <input type="date" id="f_date" required
            class="w-full bg-[var(--surface-2)] border border-[var(--border)] rounded-lg px-[11px] py-2.5 text-[var(--text)] text-[14.5px] focus:outline-none focus:ring-2 focus:ring-[var(--accent)]">
        </div>
      </div>

      <div class="grid grid-cols-1 gap-3.5 mb-3.5" id="offlineFieldsWrap" style="display:none;">
        <div>
          <label for="f_event_name" class="block text-[12.5px] text-[var(--text-muted)] mb-1.5">ชื่อรายการ / สนาม (ไม่บังคับ)</label>
          <input type="text" id="f_event_name" placeholder="เช่น Regional Bangkok, ร้าน ABC Card Shop"
            class="w-full bg-[var(--surface-2)] border border-[var(--border)] rounded-lg px-[11px] py-2.5 text-[var(--text)] text-[14.5px] focus:outline-none focus:ring-2 focus:ring-[var(--accent)]">
        </div>
      </div>

      <div class="grid grid-cols-1 gap-3.5 mb-3.5" id="eventCategoryWrap" style="display:none;">
        <div>
          <label class="block text-[12.5px] text-[var(--text-muted)] mb-1.5">ประเภทรายการ</label>
          <div class="flex flex-wrap gap-2" id="eventCategoryField">
            <div class="relative">
              <input type="radio" name="eventCategory" id="ec_none" value="" checked class="peer sr-only">
              <label for="ec_none" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-full border border-[var(--border)] bg-[var(--surface-2)] text-[13.5px] text-[var(--text)] cursor-pointer select-none peer-checked:border-[var(--accent)] peer-checked:bg-[var(--accent-soft)] peer-checked:font-semibold">ไม่ระบุ</label>
            </div>
            <div class="relative">
              <input type="radio" name="eventCategory" id="ec_gym" value="gym" class="peer sr-only">
              <label for="ec_gym" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-full border border-[var(--border)] bg-[var(--surface-2)] text-[13.5px] text-[var(--text)] cursor-pointer select-none peer-checked:border-[#e64545] peer-checked:bg-[#fbe1e1] peer-checked:font-semibold">
                <span class="inline-block w-4 h-4 rounded-full border border-black/20 shrink-0 bg-[linear-gradient(to_bottom,#e64545_0%,#e64545_46%,#222_46%,#222_54%,#fdfdfd_54%,#fdfdfd_100%)]"></span>Gym
              </label>
            </div>
            <div class="relative">
              <input type="radio" name="eventCategory" id="ec_gbl" value="gbl" class="peer sr-only">
              <label for="ec_gbl" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-full border border-[var(--border)] bg-[var(--surface-2)] text-[13.5px] text-[var(--text)] cursor-pointer select-none peer-checked:border-[#3a7bd5] peer-checked:bg-[#e1ebfb] peer-checked:font-semibold">
                <span class="inline-block w-4 h-4 rounded-full border border-black/20 shrink-0 bg-[linear-gradient(to_bottom,#3a7bd5_0%,#3a7bd5_46%,#222_46%,#222_54%,#e4ebf7_54%,#e4ebf7_100%)]"></span>GBL
              </label>
            </div>
            <div class="relative">
              <input type="radio" name="eventCategory" id="ec_ubl" value="ubl" class="peer sr-only">
              <label for="ec_ubl" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-full border border-[var(--border)] bg-[var(--surface-2)] text-[13.5px] text-[var(--text)] cursor-pointer select-none peer-checked:border-[#c89a2e] peer-checked:bg-[#faf1d8] peer-checked:font-semibold">
                <span class="inline-block w-4 h-4 rounded-full border border-black/20 shrink-0 bg-[linear-gradient(to_bottom,#2b2b2b_0%,#2b2b2b_46%,#222_46%,#222_54%,#f2c94c_54%,#f2c94c_100%)]"></span>UBL
              </label>
            </div>
            <div class="relative">
              <input type="radio" name="eventCategory" id="ec_pbl" value="pbl" class="peer sr-only">
              <label for="ec_pbl" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-full border border-[var(--border)] bg-[var(--surface-2)] text-[13.5px] text-[var(--text)] cursor-pointer select-none peer-checked:border-[#c93a3a] peer-checked:bg-[#fdeeee] peer-checked:font-semibold">
                <span class="inline-block w-4 h-4 rounded-full border border-black/20 shrink-0 bg-[linear-gradient(to_bottom,#fdfdfd_0%,#fdfdfd_30%,#e64545_30%,#e64545_42%,#222_42%,#222_46%,#fdfdfd_46%,#fdfdfd_100%)]"></span>PBL
              </label>
            </div>
            <div class="relative">
              <input type="radio" name="eventCategory" id="ec_mbl" value="mbl" class="peer sr-only">
              <label for="ec_mbl" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-full border border-[var(--border)] bg-[var(--surface-2)] text-[13.5px] text-[var(--text)] cursor-pointer select-none peer-checked:border-[#7c4fd9] peer-checked:bg-[#ede3fb] peer-checked:font-semibold">
                <span class="inline-block w-4 h-4 rounded-full border border-black/20 shrink-0 bg-[radial-gradient(circle_at_58%_34%,#f2a6e8_0_17%,transparent_18%),linear-gradient(to_bottom,#7c4fd9_0%,#7c4fd9_46%,#222_46%,#222_54%,#ece2fb_54%,#ece2fb_100%)]"></span>MBL
              </label>
            </div>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 mb-3.5">
        <div>
          <label class="block text-[12.5px] text-[var(--text-muted)] mb-1.5">เด็คของฉัน (สูงสุด 2 ตัว)</label>
          <div id="mineTrigger" data-ctx="mine"
            class="w-full min-h-[44px] flex items-center flex-wrap gap-2 bg-[var(--surface-2)] border border-[var(--border)] rounded-lg p-1.5">
            <span class="text-[var(--text-muted)] text-sm px-1">กำลังโหลด…</span>
          </div>
        </div>
        <div>
          <label class="block text-[12.5px] text-[var(--text-muted)] mb-1.5">เด็คคู่แข่ง (สูงสุด 2 ตัว)</label>
          <div id="oppTrigger" data-ctx="opp"
            class="w-full min-h-[44px] flex items-center flex-wrap gap-2 bg-[var(--surface-2)] border border-[var(--border)] rounded-lg p-1.5">
            <span class="text-[var(--text-muted)] text-sm px-1">กำลังโหลด…</span>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 mb-3.5">
        <div>
          <label for="f_mine_suffix" class="block text-[12.5px] text-[var(--text-muted)] mb-1.5">รายละเอียดเด็คของฉัน (ไม่บังคับ)</label>
          <input type="text" id="f_mine_suffix" placeholder="เช่น ex, VMAX, Box"
            class="w-full bg-[var(--surface-2)] border border-[var(--border)] rounded-lg px-[11px] py-2.5 text-[var(--text)] text-[14.5px] focus:outline-none focus:ring-2 focus:ring-[var(--accent)]">
        </div>
        <div>
          <label for="f_opp_suffix" class="block text-[12.5px] text-[var(--text-muted)] mb-1.5">รายละเอียดเด็คคู่แข่ง (ไม่บังคับ)</label>
          <input type="text" id="f_opp_suffix" placeholder="เช่น ex, VMAX, Box"
            class="w-full bg-[var(--surface-2)] border border-[var(--border)] rounded-lg px-[11px] py-2.5 text-[var(--text)] text-[14.5px] focus:outline-none focus:ring-2 focus:ring-[var(--accent)]">
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 mb-3.5">
        <div>
          <label class="block text-[12.5px] text-[var(--text-muted)] mb-1.5">ผลการแข่งขัน</label>
          <div class="flex flex-wrap gap-2">
            <div class="relative">
              <input type="radio" name="result" id="r_w" value="W" checked class="peer sr-only">
              <label for="r_w" class="inline-flex items-center px-4 py-2.5 rounded-lg border border-[var(--border)] bg-[var(--surface-2)] text-sm text-[var(--text)] cursor-pointer select-none peer-checked:border-[var(--win)] peer-checked:bg-[var(--win-soft)] peer-checked:text-[var(--win)] peer-checked:font-semibold">ชนะ</label>
            </div>
            <div class="relative">
              <input type="radio" name="result" id="r_l" value="L" class="peer sr-only">
              <label for="r_l" class="inline-flex items-center px-4 py-2.5 rounded-lg border border-[var(--border)] bg-[var(--surface-2)] text-sm text-[var(--text)] cursor-pointer select-none peer-checked:border-[var(--loss)] peer-checked:bg-[var(--loss-soft)] peer-checked:text-[var(--loss)] peer-checked:font-semibold">แพ้</label>
            </div>
          </div>
        </div>
        <div>
          <label class="block text-[12.5px] text-[var(--text-muted)] mb-1.5">ใครเริ่มก่อน</label>
          <div class="flex flex-wrap gap-2">
            <div class="relative">
              <input type="radio" name="order" id="o_first" value="first" class="peer sr-only">
              <label for="o_first" class="inline-flex items-center px-4 py-2.5 rounded-lg border border-[var(--border)] bg-[var(--surface-2)] text-sm text-[var(--text)] cursor-pointer select-none peer-checked:border-[var(--accent)] peer-checked:bg-[var(--accent-soft)] peer-checked:font-semibold">ฉันเริ่มก่อน</label>
            </div>
            <div class="relative">
              <input type="radio" name="order" id="o_second" value="second" class="peer sr-only">
              <label for="o_second" class="inline-flex items-center px-4 py-2.5 rounded-lg border border-[var(--border)] bg-[var(--surface-2)] text-sm text-[var(--text)] cursor-pointer select-none peer-checked:border-[var(--accent)] peer-checked:bg-[var(--accent-soft)] peer-checked:font-semibold">คู่แข่งเริ่มก่อน</label>
            </div>
            <div class="relative">
              <input type="radio" name="order" id="o_na" value="" checked class="peer sr-only">
              <label for="o_na" class="inline-flex items-center px-4 py-2.5 rounded-lg border border-[var(--border)] bg-[var(--surface-2)] text-sm text-[var(--text)] cursor-pointer select-none peer-checked:border-[var(--accent)] peer-checked:bg-[var(--accent-soft)] peer-checked:font-semibold">ไม่ระบุ</label>
            </div>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 gap-3.5 mb-3.5">
        <div>
          <label class="block text-[12.5px] text-[var(--text-muted)] mb-1.5">มือเปิดเกม</label>
          <button type="button" id="brickToggle" aria-pressed="false"
            class="group inline-flex items-center gap-2 border border-[var(--border)] bg-[var(--surface-2)] text-[var(--text)] text-sm px-4 py-2.5 rounded-lg cursor-pointer select-none aria-[pressed=true]:border-[var(--accent)] aria-[pressed=true]:bg-[var(--accent-soft)] aria-[pressed=true]:font-semibold">
            <span class="w-[17px] h-[17px] rounded border border-[var(--text-muted)] bg-[var(--surface)] flex items-center justify-center text-[11px] shrink-0 group-aria-[pressed=true]:bg-[var(--accent)] group-aria-[pressed=true]:border-[var(--accent)] group-aria-[pressed=true]:text-white">🧱</span>
            มือนี้ Brick (เปิดมือไม่มีของ)
          </button>
        </div>
      </div>

      <div class="grid grid-cols-1 gap-3.5 mb-3.5">
        <div>
          <label for="f_notes" class="block text-[12.5px] text-[var(--text-muted)] mb-1.5">หมายเหตุ (ไม่บังคับ)</label>
          <textarea id="f_notes" placeholder="เช่น เปิดมือช้า, โดนล็อกพลังงานตั้งแต่ต้นเกม"
            class="w-full min-h-[56px] resize-y bg-[var(--surface-2)] border border-[var(--border)] rounded-lg px-[11px] py-2.5 text-[var(--text)] text-[14.5px] focus:outline-none focus:ring-2 focus:ring-[var(--accent)]"></textarea>
        </div>
      </div>

      <p class="text-[var(--loss)] text-[12.5px] min-h-[1em] mb-1" id="formHint"></p>
      <button type="submit" id="submitBtn"
        class="border-0 bg-[var(--accent)] text-white font-semibold text-[15px] px-[22px] py-[11px] rounded-[9px] cursor-pointer hover:brightness-110">
        บันทึกแมทช์
      </button>
    </form>
  </section>

  <section class="bg-[var(--surface)] border border-[var(--border)] rounded-2xl shadow-sm p-[22px] mb-6">
    <div class="flex items-center justify-between flex-wrap gap-2.5 mb-3.5">
      <h2 class="font-display text-[19px] font-semibold">สรุปคู่ต่อสู้</h2>
      <select id="deckFilter"
        class="w-auto min-w-[160px] bg-[var(--surface-2)] border border-[var(--border)] rounded-lg px-[11px] py-2 text-[var(--text)] text-[14.5px] focus:outline-none focus:ring-2 focus:ring-[var(--accent)]"></select>
    </div>
    <div id="matchupTableWrap"></div>
  </section>

  <section class="bg-[var(--surface)] border border-[var(--border)] rounded-2xl shadow-sm p-[22px]">
    <div class="flex items-center justify-between flex-wrap gap-2.5 mb-3.5">
      <h2 class="font-display text-[19px] font-semibold">ประวัติการแข่งขัน</h2>
    </div>
    <div id="logList"></div>
  </section>

</div>

<div id="pokeModal" class="fixed inset-0 bg-black/50 z-50 hidden items-end sm:items-center justify-center sm:p-5">
  <div class="bg-[var(--surface)] w-full max-w-[480px] max-h-[78vh] sm:max-h-[620px] rounded-t-2xl sm:rounded-2xl flex flex-col overflow-hidden [padding-bottom:env(safe-area-inset-bottom,0px)]">
    <div class="px-[18px] pt-4 pb-3 border-b border-[var(--border)] shrink-0">
      <div class="flex items-center justify-between mb-2.5">
        <h3 id="pokeModalTitle" class="font-display text-[17px] font-semibold m-0">เลือกโปเกมอน</h3>
        <button type="button" id="pokeModalClose" aria-label="ปิด"
          class="bg-[var(--surface-2)] text-[var(--text-muted)] w-[30px] h-[30px] rounded-full text-[15px] shrink-0 cursor-pointer">✕</button>
      </div>
      <input type="text" id="pokeSearch" placeholder="ค้นหาชื่อโปเกมอน (ภาษาอังกฤษ)…"
        class="w-full bg-[var(--surface-2)] border border-[var(--border)] rounded-lg px-[11px] py-2.5 text-[var(--text)] text-[14.5px] focus:outline-none focus:ring-2 focus:ring-[var(--accent)]">
    </div>
    <div id="pokeGrid" class="overflow-y-auto p-3 grid grid-cols-[repeat(auto-fill,minmax(78px,1fr))] gap-2"></div>
  </div>
</div>

<script>
(async function () {
  var STORAGE_KEY = 'ptcg_matchlog_v1';
  var pendingDelete = {};
  var pendingDeleteTimers = {};

  var POKEMON_DATA = [];
  try {
    var res = await fetch('./pokemon-data.json');
    POKEMON_DATA = await res.json();
  } catch (e) {
    console.error('โหลดข้อมูลโปเกมอนไม่สำเร็จ', e);
  }
  var POKEMON_BY_ID = {};
  POKEMON_DATA.forEach(function (p) { POKEMON_BY_ID[p.id] = p; });

  var pickerContext = null;
  var MAX_PER_SIDE = 2;
  var selection = { mine: [], opp: [] };
  var brickState = false;
  var currentMode = 'live';

  var EVENT_CATEGORY_LABELS = { gym: 'Gym', gbl: 'GBL', ubl: 'UBL', pbl: 'PBL', mbl: 'MBL' };
  var EVENT_CATEGORY_ICON_CLASS = {
    gym: 'bg-[linear-gradient(to_bottom,#e64545_0%,#e64545_46%,#222_46%,#222_54%,#fdfdfd_54%,#fdfdfd_100%)]',
    gbl: 'bg-[linear-gradient(to_bottom,#3a7bd5_0%,#3a7bd5_46%,#222_46%,#222_54%,#e4ebf7_54%,#e4ebf7_100%)]',
    ubl: 'bg-[linear-gradient(to_bottom,#2b2b2b_0%,#2b2b2b_46%,#222_46%,#222_54%,#f2c94c_54%,#f2c94c_100%)]',
    pbl: 'bg-[linear-gradient(to_bottom,#fdfdfd_0%,#fdfdfd_30%,#e64545_30%,#e64545_42%,#222_42%,#222_46%,#fdfdfd_46%,#fdfdfd_100%)]',
    mbl: 'bg-[radial-gradient(circle_at_58%_34%,#f2a6e8_0_17%,transparent_18%),linear-gradient(to_bottom,#7c4fd9_0%,#7c4fd9_46%,#222_46%,#222_54%,#ece2fb_54%,#ece2fb_100%)]'
  };
  var MODE_COPY = {
    live: {
      wordmark: 'สมุดแมทช์ · TCG Live',
      tagline: 'บันทึกผลแมทช์ TCG Live ประจำวัน แล้วดูอัตราชนะของเด็คคุณ',
      formTitle: 'บันทึกแมทช์ใหม่ (TCG Live)'
    },
    offline: {
      wordmark: 'สมุดแมทช์ · เล่นข้างนอก',
      tagline: 'บันทึกผลการแข่งขันแบบจับต้องจริง ตั้งชื่อรายการและระบุประเภทได้',
      formTitle: 'บันทึกแมทช์ใหม่ (เล่นข้างนอก)'
    }
  };

  function matchMode(m) { return m.mode || 'live'; }

  function loadMatches() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      console.error('ไม่สามารถโหลดข้อมูลได้', e);
      return [];
    }
  }

  function saveMatches(arr) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
      return true;
    } catch (e) {
      console.error('ไม่สามารถบันทึกข้อมูลได้', e);
      return false;
    }
  }

  var matches = loadMatches();

  function escapeHtml(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function uid() {
    return 'm_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
  }

  function todayISO() {
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + m + '-' + day;
  }

  function formatDateLabel(iso) {
    try {
      var d = new Date(iso + 'T00:00:00');
      return new Intl.DateTimeFormat('th-TH', { day: 'numeric', month: 'long', year: 'numeric' }).format(d);
    } catch (e) {
      return iso;
    }
  }

  function uniqueSorted(values) {
    var seen = {};
    var out = [];
    values.forEach(function (v) {
      var key = (v || '').trim();
      if (key && !seen[key]) { seen[key] = true; out.push(key); }
    });
    out.sort(function (a, b) { return a.localeCompare(b, 'th'); });
    return out;
  }

  function spriteFor(id) {
    if (id === undefined || id === null) return null;
    var p = POKEMON_BY_ID[id];
    return p ? p.sprite : null;
  }

  function idsForDeck(m, prefix) {
    var arr = m[prefix + 'DeckIds'];
    if (Array.isArray(arr) && arr.length) return arr;
    var single = m[prefix + 'DeckId'];
    return (single !== undefined && single !== null) ? [single] : [];
  }

  function deckSpritesHtml(ids) {
    return ids.map(function (id) {
      var s = spriteFor(id);
      return s ? '<img class="w-6 h-6 object-contain [image-rendering:pixelated]" src="' + s + '" alt="">' : '';
    }).join('');
  }

  // ---------- Pokémon picker modal ----------

  function openPicker(context) {
    pickerContext = context;
    document.getElementById('pokeModalTitle').textContent =
      (context === 'mine' ? 'เลือกโปเกมอนสำหรับเด็คของฉัน' : 'เลือกโปเกมอนสำหรับเด็คคู่แข่ง') + ' (สูงสุด ' + MAX_PER_SIDE + ' ตัว)';
    var searchInput = document.getElementById('pokeSearch');
    searchInput.value = '';
    renderPokeGrid('');
    var overlay = document.getElementById('pokeModal');
    overlay.classList.remove('hidden');
    overlay.classList.add('flex');
    setTimeout(function () { searchInput.focus(); }, 30);
  }

  function closePicker() {
    var overlay = document.getElementById('pokeModal');
    overlay.classList.add('hidden');
    overlay.classList.remove('flex');
    pickerContext = null;
  }

  function renderPokeGrid(query) {
    var grid = document.getElementById('pokeGrid');
    var q = query.trim().toLowerCase();
    var filtered = q ? POKEMON_DATA.filter(function (p) { return p.name.toLowerCase().indexOf(q) !== -1; }) : POKEMON_DATA;
    var limited = filtered.slice(0, 150);
    var currentIds = selection[pickerContext].map(function (p) { return p.id; });
    var atLimit = currentIds.length >= MAX_PER_SIDE;

    if (limited.length === 0) {
      grid.innerHTML = '<div class="col-span-full text-center text-[var(--text-muted)] text-[13.5px] py-8 px-2.5">ไม่พบโปเกมอนที่ตรงกับ “' + escapeHtml(query) + '”</div>';
      return;
    }

    var itemBase = 'flex flex-col items-center gap-1 bg-[var(--surface-2)] border rounded-[10px] p-2 cursor-pointer text-center';
    var html = limited.map(function (p) {
      var isPicked = currentIds.indexOf(p.id) !== -1;
      var isDisabled = !isPicked && atLimit;
      var cls = itemBase + ' ' +
        (isPicked ? 'border-[var(--accent)] bg-[var(--accent-soft)]' : 'border-[var(--border)] hover:border-[var(--accent)]') +
        (isDisabled ? ' opacity-40 pointer-events-none' : '');
      return '<button type="button" class="' + cls + '" data-id="' + p.id + '">' +
        '<img class="w-10 h-10 object-contain [image-rendering:pixelated]" src="' + p.sprite + '" alt="" loading="lazy">' +
        '<span class="text-[11px] leading-tight break-words">' + escapeHtml(p.name) + (isPicked ? ' ✓' : '') + '</span>' +
      '</button>';
    }).join('');

    if (atLimit) {
      html += '<div class="col-span-full text-center text-[var(--text-muted)] text-xs py-2 px-2.5">เลือกครบ ' + MAX_PER_SIDE + ' ตัวแล้ว — แตะตัวที่เลือกไว้เพื่อเอาออก</div>';
    } else if (filtered.length > limited.length) {
      html += '<div class="col-span-full text-center text-[var(--text-muted)] text-xs py-2 px-2.5">พิมพ์ค้นหาต่อเพื่อดูผลลัพธ์ที่ตรงมากขึ้น (ทั้งหมด ' + filtered.length + ' รายการ)</div>';
    }

    grid.innerHTML = html;

    grid.querySelectorAll('[data-id]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = parseInt(btn.getAttribute('data-id'), 10);
        var arr = selection[pickerContext];
        var idx = arr.findIndex(function (p) { return p.id === id; });
        if (idx !== -1) {
          arr.splice(idx, 1);
        } else {
          if (arr.length >= MAX_PER_SIDE) return;
          arr.push(POKEMON_BY_ID[id]);
        }
        updateTrigger(pickerContext);
        updateSubmitState();
        renderPokeGrid(document.getElementById('pokeSearch').value);
      });
    });
  }

  function updateTrigger(context) {
    var trigger = document.getElementById(context === 'mine' ? 'mineTrigger' : 'oppTrigger');
    var arr = selection[context];
    var html = arr.map(function (p) {
      return '<span class="inline-flex items-center gap-1.5 bg-[var(--surface)] border border-[var(--border)] rounded-full py-1 pr-1.5 pl-1 text-[13px] text-[var(--text)]" data-id="' + p.id + '">' +
        '<img class="w-[26px] h-[26px] object-contain [image-rendering:pixelated]" src="' + p.sprite + '" alt="">' +
        '<span>' + escapeHtml(p.name) + '</span>' +
        '<button type="button" class="text-[var(--text-muted)] hover:text-[var(--loss)] text-sm leading-none px-0.5 cursor-pointer" data-remove-id="' + p.id + '" aria-label="เอาออก">✕</button>' +
      '</span>';
    }).join('');
    if (arr.length < MAX_PER_SIDE) {
      html += '<button type="button" class="border border-dashed border-[var(--border)] text-[var(--text-muted)] text-[13.5px] px-3 py-2 rounded-full cursor-pointer hover:border-[var(--accent)] hover:text-[var(--accent)]" data-add="1">' +
        (arr.length === 0 ? '🃏 แตะเพื่อเลือกโปเกมอน' : '+ เพิ่มอีก 1 ตัว') +
      '</button>';
    }
    trigger.innerHTML = html;
  }

  function handleTriggerClick(context, e) {
    var removeBtn = e.target.closest('[data-remove-id]');
    if (removeBtn) {
      var id = parseInt(removeBtn.getAttribute('data-remove-id'), 10);
      selection[context] = selection[context].filter(function (p) { return p.id !== id; });
      updateTrigger(context);
      updateSubmitState();
      return;
    }
    if (e.target.closest('[data-add]')) {
      openPicker(context);
    }
  }

  document.getElementById('mineTrigger').addEventListener('click', function (e) { handleTriggerClick('mine', e); });
  document.getElementById('oppTrigger').addEventListener('click', function (e) { handleTriggerClick('opp', e); });

  document.getElementById('brickToggle').addEventListener('click', function () {
    brickState = !brickState;
    this.setAttribute('aria-pressed', brickState ? 'true' : 'false');
  });

  function applyModeToForm() {
    var copy = MODE_COPY[currentMode];
    document.getElementById('wordmarkText').textContent = copy.wordmark;
    document.getElementById('taglineText').textContent = copy.tagline;
    document.getElementById('formTitle').textContent = copy.formTitle;

    var offlineFieldsWrap = document.getElementById('offlineFieldsWrap');
    var eventCategoryWrap = document.getElementById('eventCategoryWrap');
    var dateInput = document.getElementById('f_date');

    if (currentMode === 'offline') {
      offlineFieldsWrap.style.display = '';
      eventCategoryWrap.style.display = '';
      dateInput.disabled = false;
    } else {
      offlineFieldsWrap.style.display = 'none';
      eventCategoryWrap.style.display = 'none';
      document.getElementById('f_event_name').value = '';
      document.getElementById('ec_none').checked = true;
      dateInput.disabled = false;
      dateInput.value = todayISO();
    }
  }

  function switchMode(mode) {
    currentMode = mode;
    var liveTab = document.getElementById('tabLive');
    var offlineTab = document.getElementById('tabOffline');
    var activeCls = ['border-[var(--accent)]', 'bg-[var(--accent-soft)]', 'text-[var(--text)]'];
    var inactiveCls = ['border-[var(--border)]', 'bg-[var(--surface)]', 'text-[var(--text-muted)]'];
    [liveTab, offlineTab].forEach(function (tab) {
      activeCls.forEach(function (c) { tab.classList.remove(c); });
      inactiveCls.forEach(function (c) { tab.classList.remove(c); });
    });
    var activeTab = mode === 'live' ? liveTab : offlineTab;
    var inactiveTab = mode === 'live' ? offlineTab : liveTab;
    activeCls.forEach(function (c) { activeTab.classList.add(c); });
    inactiveCls.forEach(function (c) { inactiveTab.classList.add(c); });
    applyModeToForm();
    document.getElementById('deckFilter').value = '';
    renderAll();
  }

  document.getElementById('tabLive').addEventListener('click', function () { switchMode('live'); });
  document.getElementById('tabOffline').addEventListener('click', function () { switchMode('offline'); });

  document.getElementById('pokeModalClose').addEventListener('click', closePicker);
  document.getElementById('pokeModal').addEventListener('click', function (e) {
    if (e.target.id === 'pokeModal') closePicker();
  });
  document.getElementById('pokeSearch').addEventListener('input', function (e) {
    renderPokeGrid(e.target.value);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !document.getElementById('pokeModal').classList.contains('hidden')) closePicker();
  });

  // ---------- stats ----------

  function computeOverallStats(list) {
    var wins = 0, losses = 0, bricks = 0;
    list.forEach(function (m) {
      if (m.result === 'W') wins++;
      else if (m.result === 'L') losses++;
      if (m.brick) bricks++;
    });
    var total = list.length;
    var winRate = total > 0 ? Math.round((wins / total) * 100) : null;
    var brickRate = total > 0 ? Math.round((bricks / total) * 100) : null;

    var sorted = list.slice().sort(function (a, b) { return b.createdAt - a.createdAt; });
    var streakCount = 0, streakResult = null;
    if (sorted.length > 0) {
      streakResult = sorted[0].result;
      for (var i = 0; i < sorted.length; i++) {
        if (sorted[i].result === streakResult) streakCount++;
        else break;
      }
    }
    return { total: total, wins: wins, losses: losses, winRate: winRate, streakCount: streakCount, streakResult: streakResult, bricks: bricks, brickRate: brickRate };
  }

  function computeMatchupStats(list) {
    var byOpp = {};
    list.forEach(function (m) {
      if (!byOpp[m.oppDeck]) byOpp[m.oppDeck] = { deck: m.oppDeck, deckIds: idsForDeck(m, 'opp'), games: 0, wins: 0, losses: 0 };
      var row = byOpp[m.oppDeck];
      row.games++;
      if (m.result === 'W') row.wins++;
      else if (m.result === 'L') row.losses++;
    });
    var rows = Object.keys(byOpp).map(function (k) { return byOpp[k]; });
    rows.forEach(function (r) { r.winRate = r.games > 0 ? Math.round((r.wins / r.games) * 100) : 0; });
    rows.sort(function (a, b) { return b.games - a.games; });
    return rows;
  }

  function streakLabel(stats) {
    if (stats.total === 0) return '—';
    var word = stats.streakResult === 'W' ? 'ชนะ' : 'แพ้';
    return word + ' × ' + stats.streakCount;
  }

  function chipHtml(value, label, valueCls) {
    return '<div class="bg-[var(--surface)] border border-[var(--border)] rounded-[10px] px-3.5 py-2 text-center min-w-[74px] shadow-sm">' +
      '<span class="block font-display text-xl font-semibold leading-tight' + (valueCls ? ' ' + valueCls : '') + '">' + value + '</span>' +
      '<span class="block text-[11px] text-[var(--text-muted)] leading-tight mt-0.5">' + label + '</span>' +
    '</div>';
  }

  function renderStatChips(stats) {
    var el = document.getElementById('statChips');
    el.innerHTML =
      chipHtml(stats.total, 'เกมทั้งหมด') +
      chipHtml(stats.winRate === null ? '—' : stats.winRate + '%', 'อัตราชนะ', 'text-[var(--win)]') +
      chipHtml(stats.wins + 'W ' + stats.losses + 'L', 'สถิติรวม') +
      chipHtml(streakLabel(stats), 'ล่าสุดติดต่อกัน') +
      chipHtml('🧱 ' + (stats.brickRate === null ? '—' : stats.brickRate + '%'), 'อัตรา Brick (' + stats.bricks + ' เกม)');
  }

  function renderDeckFilter(allMatches, currentValue) {
    var select = document.getElementById('deckFilter');
    var decks = uniqueSorted(allMatches.map(function (m) { return m.myDeck; }));
    var html = '<option value="">เด็คของฉันทั้งหมด</option>';
    decks.forEach(function (d) {
      html += '<option value="' + escapeHtml(d) + '"' + (d === currentValue ? ' selected' : '') + '>' + escapeHtml(d) + '</option>';
    });
    select.innerHTML = html;
  }

  function renderMatchupTable(rows) {
    var wrap = document.getElementById('matchupTableWrap');
    if (rows.length === 0) {
      wrap.innerHTML = '<div class="text-center py-8 px-2.5 text-[var(--text-muted)] text-sm">ยังไม่มีข้อมูลพอสำหรับสรุปคู่ต่อสู้ — บันทึกแมทช์สักสองสามเกมก่อน</div>';
      return;
    }
    var body = rows.map(function (r) {
      var spritesHtml = deckSpritesHtml(r.deckIds);
      return '<tr>' +
        '<td class="px-2 py-2.5 border-b border-[var(--border)]"><div class="flex items-center gap-1.5">' + spritesHtml + escapeHtml(r.deck) + '</div></td>' +
        '<td class="px-2 py-2.5 border-b border-[var(--border)] text-right">' + r.games + '</td>' +
        '<td class="px-2 py-2.5 border-b border-[var(--border)] text-right">' + r.wins + '</td>' +
        '<td class="px-2 py-2.5 border-b border-[var(--border)] text-right">' + r.losses + '</td>' +
        '<td class="px-2 py-2.5 border-b border-[var(--border)] min-w-[120px]">' +
          '<div class="flex items-center gap-2"><div class="flex-1 h-1.5 rounded-full bg-[var(--tie-soft)] overflow-hidden"><span class="block h-full bg-[var(--win)]" style="width:' + r.winRate + '%"></span></div><span class="text-[12.5px] min-w-[34px] text-right">' + r.winRate + '%</span></div>' +
        '</td>' +
      '</tr>';
    }).join('');
    wrap.innerHTML =
      '<div class="overflow-x-auto"><table class="w-full text-sm border-collapse"><thead><tr class="text-[var(--text-muted)] text-[12.5px]">' +
      '<th class="text-left px-2 py-2 font-normal">เด็คคู่แข่ง</th><th class="text-right px-2 py-2 font-normal">เกม</th><th class="text-right px-2 py-2 font-normal">ชนะ</th><th class="text-right px-2 py-2 font-normal">แพ้</th><th class="text-left px-2 py-2 font-normal">อัตราชนะ</th>' +
      '</tr></thead><tbody>' + body + '</tbody></table></div>';
  }

  function renderLogList(list) {
    var wrap = document.getElementById('logList');
    if (list.length === 0) {
      wrap.innerHTML = '<div class="text-center py-8 px-2.5 text-[var(--text-muted)] text-sm">ยังไม่มีบันทึกการแข่งขัน — เริ่มบันทึกแมทช์แรกของคุณด้วยฟอร์มด้านบน</div>';
      return;
    }
    var sorted = list.slice().sort(function (a, b) { return b.createdAt - a.createdAt; });
    var groups = [];
    var groupMap = {};
    sorted.forEach(function (m) {
      if (!groupMap[m.date]) {
        groupMap[m.date] = [];
        groups.push(m.date);
      }
      groupMap[m.date].push(m);
    });

    var html = groups.map(function (date) {
      var rows = groupMap[date].map(function (m) {
        var orderLabel = m.order === 'first' ? 'ฉันเริ่มก่อน' : m.order === 'second' ? 'คู่แข่งเริ่มก่อน' : '';
        var resultWord = m.result === 'W' ? 'ชนะ' : m.result === 'L' ? 'แพ้' : 'เสมอ (บันทึกเดิม)';
        var isConfirming = !!pendingDelete[m.id];
        var mineSpritesHtml = deckSpritesHtml(idsForDeck(m, 'my'));
        var oppSpritesHtml = deckSpritesHtml(idsForDeck(m, 'opp'));
        var categoryBadge = m.eventCategory && EVENT_CATEGORY_LABELS[m.eventCategory]
          ? ' <span class="inline-flex items-center gap-1 border border-[var(--border)] bg-[var(--surface-2)] rounded-full px-2 py-0.5 font-semibold text-[11px]"><span class="inline-block w-3 h-3 rounded-full border border-black/20 ' + EVENT_CATEGORY_ICON_CLASS[m.eventCategory] + '"></span>' + EVENT_CATEGORY_LABELS[m.eventCategory] + '</span>'
          : '';
        var eventNameTag = m.eventName ? ' <span>· ' + escapeHtml(m.eventName) + '</span>' : '';
        var resultPillCls = m.result === 'W' ? 'bg-[var(--win-soft)] text-[var(--win)]' : 'bg-[var(--loss-soft)] text-[var(--loss)]';
        return (
          '<div class="flex items-center gap-3 py-2.5 border-b border-[var(--border)] last:border-b-0">' +
            '<div class="w-[30px] h-[30px] rounded-full flex items-center justify-center font-bold text-[13px] shrink-0 ' + resultPillCls + '">' + m.result + '</div>' +
            '<div class="min-w-0 flex-1">' +
              '<div class="text-[14.5px] font-medium flex items-center flex-wrap gap-1">' +
                '<span class="inline-flex items-center gap-1">' + mineSpritesHtml + escapeHtml(m.myDeck) + '</span>' +
                '<span class="text-[var(--text-muted)] font-normal mx-1">vs</span>' +
                '<span class="inline-flex items-center gap-1">' + oppSpritesHtml + escapeHtml(m.oppDeck) + '</span>' +
              '</div>' +
              '<div class="text-[12.5px] text-[var(--text-muted)] mt-0.5 flex flex-wrap items-center gap-x-1.5">' +
                '<span>' + resultWord + (orderLabel ? ' · ' + orderLabel : '') + (m.brick ? ' · 🧱 Brick' : '') + '</span>' + eventNameTag + categoryBadge +
              '</div>' +
              (m.notes ? '<div class="text-[13px] text-[var(--text-muted)] mt-1">' + escapeHtml(m.notes) + '</div>' : '') +
            '</div>' +
            '<button type="button" class="shrink-0 border text-[12.5px] px-2.5 py-1.5 rounded-lg cursor-pointer ' +
              (isConfirming ? 'border-[var(--loss)] text-[var(--loss)] font-semibold' : 'border-[var(--border)] text-[var(--text-muted)] hover:bg-[var(--surface-2)]') +
              '" data-id="' + m.id + '">' +
              (isConfirming ? 'ยืนยันการลบ' : 'ลบ') +
            '</button>' +
          '</div>'
        );
      }).join('');
      return '<div class="mb-[18px]"><p class="text-[12.5px] text-[var(--text-muted)] font-semibold mb-2">' + formatDateLabel(date) + '</p>' + rows + '</div>';
    }).join('');

    wrap.innerHTML = html;

    wrap.querySelectorAll('[data-id]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-id');
        if (pendingDelete[id]) {
          clearTimeout(pendingDeleteTimers[id]);
          delete pendingDeleteTimers[id];
          delete pendingDelete[id];
          matches = matches.filter(function (m) { return m.id !== id; });
          saveMatches(matches);
          renderAll();
        } else {
          pendingDelete[id] = true;
          pendingDeleteTimers[id] = setTimeout(function () {
            delete pendingDelete[id];
            renderAll();
          }, 3000);
          renderAll();
        }
      });
    });
  }

  function currentFilterValue() {
    var select = document.getElementById('deckFilter');
    return select ? select.value : '';
  }

  function renderAll() {
    var modeMatches = matches.filter(function (m) { return matchMode(m) === currentMode; });
    var filterValue = currentFilterValue();
    var overallStats = computeOverallStats(modeMatches);
    renderStatChips(overallStats);
    renderDeckFilter(modeMatches, filterValue);

    var filtered = filterValue ? modeMatches.filter(function (m) { return m.myDeck === filterValue; }) : modeMatches;
    renderMatchupTable(computeMatchupStats(filtered));
    renderLogList(filtered);
  }

  // ---------- form ----------

  function updateSubmitState() {
    var hint = document.getElementById('formHint');
    if (selection.mine.length === 0 || selection.opp.length === 0) {
      hint.textContent = 'เลือกโปเกมอนอย่างน้อย 1 ตัวของทั้งสองฝั่งก่อนบันทึก (สูงสุด 2 ตัวต่อฝั่ง)';
    } else {
      hint.textContent = '';
    }
  }

  document.getElementById('matchForm').addEventListener('submit', function (e) {
    e.preventDefault();
    if (selection.mine.length === 0 || selection.opp.length === 0) {
      updateSubmitState();
      return;
    }
    var dateVal = document.getElementById('f_date').value || todayISO();
    var resultVal = document.querySelector('input[name="result"]:checked').value;
    var orderVal = document.querySelector('input[name="order"]:checked').value;
    var notesVal = document.getElementById('f_notes').value.trim();
    var mineSuffix = document.getElementById('f_mine_suffix').value.trim();
    var oppSuffix = document.getElementById('f_opp_suffix').value.trim();
    var eventNameVal = currentMode === 'offline' ? document.getElementById('f_event_name').value.trim() : '';
    var eventCategoryVal = currentMode === 'offline' ? document.querySelector('input[name="eventCategory"]:checked').value : '';

    var myDeckName = selection.mine.map(function (p) { return p.name; }).join(' & ') + (mineSuffix ? ' ' + mineSuffix : '');
    var oppDeckName = selection.opp.map(function (p) { return p.name; }).join(' & ') + (oppSuffix ? ' ' + oppSuffix : '');

    matches.push({
      id: uid(),
      mode: currentMode,
      date: dateVal,
      eventName: eventNameVal,
      eventCategory: eventCategoryVal,
      myDeck: myDeckName,
      myDeckIds: selection.mine.map(function (p) { return p.id; }),
      oppDeck: oppDeckName,
      oppDeckIds: selection.opp.map(function (p) { return p.id; }),
      result: resultVal,
      order: orderVal,
      brick: brickState,
      notes: notesVal,
      createdAt: Date.now()
    });
    saveMatches(matches);

    selection.opp = [];
    updateTrigger('opp');
    brickState = false;
    document.getElementById('brickToggle').setAttribute('aria-pressed', 'false');
    if (currentMode === 'offline') {
      document.getElementById('f_event_name').value = '';
      document.getElementById('ec_none').checked = true;
    }
    document.getElementById('f_opp_suffix').value = '';
    document.getElementById('f_notes').value = '';
    document.getElementById('r_w').checked = true;
    document.getElementById('o_na').checked = true;
    updateSubmitState();

    renderAll();
  });

  document.getElementById('deckFilter').addEventListener('change', renderAll);

  updateTrigger('mine');
  updateTrigger('opp');
  updateSubmitState();
  applyModeToForm();
  renderAll();
})();
</script>
</body>
</html>
